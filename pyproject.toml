[project]
name = "g1tt"
version = "0.1.0"
description = "Two Unitree G1 humanoids learn table tennis rallies in MuJoCo: a HITTER-style planner, human strokes and a self-play PPO whole-body controller"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mujoco>=3.3",
  "jax>=0.4.30",
  "numpy>=1.26",
  "torch>=2.4",
  "imageio[ffmpeg]>=2.34",
]

[project.optional-dependencies]
# GPU training (g1tt.gpu): MJX with MuJoCo Warp on an NVIDIA GPU.
gpu = ["mujoco-mjx>=3.3", "warp-lang", "jax[cuda12]>=0.4.30"]
dev = ["pytest>=8.0", "mujoco-mjx>=3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g1tt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
